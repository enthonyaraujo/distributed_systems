# Cabeçalhos de Segurança HTTP para AWS Amplify — AcadFlow (SEC-02)
# Ativado em produção no app Amplify `acadflow-web` em 23/11/2026 com CSP em modo Report-Only.
#
# Fase atual: Content-Security-Policy-Report-Only (não bloqueante, sem endpoint externo)
# para validar zero violações no navegador com React/Vite, Tiptap, API institucional e Cognito
# antes de qualquer promoção para CSP bloqueante.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: X-Frame-Options
        value: 'DENY'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=()'
      - key: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.enthonyaraujo.grupo-03.sd.ufersa.dev.br https://acadflow-enthony-sd.auth.us-east-1.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://acadflow-enthony-sd.auth.us-east-1.amazoncognito.com"
